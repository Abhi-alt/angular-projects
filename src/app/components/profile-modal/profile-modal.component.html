<h2 mat-dialog-title>Edit Profile</h2>
<mat-dialog-content class="profile-content">
  <form
    class="profile-form"
    [formGroup]="userProfileForm"
    (ngSubmit)="onSubmit()"
    id="profileForm"
  >
    <div class="row">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error>Please provide a valid name.</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>
    </div>
    <div class="col">
      <mat-form-field class="full">
        <mat-label>Date of birth</mat-label>
        <input matInput [matDatepicker]="dob" formControlName="dob" />
        <mat-datepicker #dob></mat-datepicker>
        <mat-datepicker-toggle
          [for]="dob"
          matIconSuffix
        ></mat-datepicker-toggle>
      </mat-form-field>
      <mat-form-field class="full">
        <mat-label>Phone number</mat-label>
        <input matInput formControlName="phone" />
        <mat-error>Please provide a valid phone number</mat-error>
      </mat-form-field>
    </div>
    <div class="col">
      <mat-form-field class="full">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>
      <mat-form-field class="full">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-dialog-close mat-button>Close</button>
  <button mat-dialog-close mat-button type="submit" form="profileForm">
    Save
  </button>
</mat-dialog-actions>
